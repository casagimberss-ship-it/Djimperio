name: Compilacion manual - IMPERIO DJ PRO

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Preparar proyecto y generar APK
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar codigo fuente
        shell: bash
        run: |
          set -euo pipefail

          # Si el proyecto no esta extraido en la raiz, buscar el ZIP subido al repositorio.
          if [[ ! -f "settings.gradle.kts" && ! -f "settings.gradle" ]]; then
            ZIP_FILE="$(find . -maxdepth 3 -type f -iname '*.zip' -print -quit)"
            if [[ -z "${ZIP_FILE}" ]]; then
              echo "::error::No se encontro settings.gradle(.kts) ni un ZIP del proyecto."
              echo "Extrae IMPERIO_DJ_PRO_V1_SOURCE.zip en la raiz del repositorio o sube el ZIP."
              exit 1
            fi

            echo "Extrayendo: ${ZIP_FILE}"
            mkdir -p /tmp/imperio-source
            unzip -q "${ZIP_FILE}" -d /tmp/imperio-source

            SETTINGS_FILE="$(find /tmp/imperio-source -type f \\( -name settings.gradle.kts -o -name settings.gradle \\) -print -quit)"
            if [[ -z "${SETTINGS_FILE}" ]]; then
              echo "::error::El ZIP no contiene settings.gradle ni settings.gradle.kts."
              exit 1
            fi

            PROJECT_ROOT="$(dirname "${SETTINGS_FILE}")"
            cp -a "${PROJECT_ROOT}/." .
          fi

          if [[ ! -f "app/build.gradle.kts" && ! -f "app/build.gradle" ]]; then
            echo "::error::No se encontro la carpeta app con su archivo build.gradle."
            echo "Verifica que el proyecto Android este en la raiz del repositorio."
            exit 1
          fi

          echo "Estructura Gradle encontrada:"
          ls -la
          ls -la app

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK Debug
        run: gradle assembleDebug --stacktrace

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: IMPERIO-DJ-PRO-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
