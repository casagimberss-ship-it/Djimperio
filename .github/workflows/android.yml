
name: Compilar y generar APK - IMPERIO DJ PRO

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Compilar APK Android
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar codigo fuente
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -f settings.gradle.kts && ! -f settings.gradle ]]; then

            ZIP_FILE="$(find . -maxdepth 5 -type f -iname '*.zip' -print -quit)"

            if [[ -z "$ZIP_FILE" ]]; then
              echo "::error::No se encontro el ZIP del proyecto"
              exit 1
            fi

            mkdir -p /tmp/imperio-source
            unzip -q "$ZIP_FILE" -d /tmp/imperio-source

            SETTINGS_FILE="$(find /tmp/imperio-source -type f -name settings.gradle.kts -print -quit)"

            if [[ -z "$SETTINGS_FILE" ]]; then
              SETTINGS_FILE="$(find /tmp/imperio-source -type f -name settings.gradle -print -quit)"
            fi

            if [[ -z "$SETTINGS_FILE" ]]; then
              echo "::error::No se encontro settings.gradle"
              exit 1
            fi

            PROJECT_ROOT="$(dirname "$SETTINGS_FILE")"
            cp -a "$PROJECT_ROOT/." .
          fi

          if [[ ! -f app/build.gradle.kts ]]; then
            echo "::error::No se encontro app/build.gradle.kts"
            exit 1
          fi

          echo "Proyecto encontrado correctamente"

      - name: Corregir compatibilidad Java y Kotlin
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          path = Path("app/build.gradle.kts")
          content = path.read_text(encoding="utf-8")

          if "compileOptions {" not in content:
              position = content.rfind("}")
              if position < 0:
                  raise SystemExit("No se encontro el bloque android")

              config = """
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
              """

              content = content[:position] + config + content[position:]

          path.write_text(content, encoding="utf-8")
          print("Java 17 y Kotlin 17 configurados")
          PY

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Configurar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verificar entorno
        run: |
          java -version
          gradle --version

      - name: Limpiar y compilar APK
        run: gradle --no-daemon clean assembleDebug --stacktrace

      - name: Verificar APK
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [[ ! -f "$APK" ]]; then
            echo "::error::No se genero el APK"
            exit 1
          fi

          echo "APK generado correctamente:"
          ls -lh "$APK"

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: IMPERIO-DJ-PRO-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
          
